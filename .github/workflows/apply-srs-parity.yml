name: Apply SRS parity patch
on:
  push:
    branches: [fix/duff-leech-middle-deck-parity]
permissions:
  contents: write
jobs:
  patch-test-commit:
    if: "!contains(github.event.head_commit.message, '[srs-parity-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/duff-leech-middle-deck-parity
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply canonical Duff leech semantics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('js/app/main.js')
          s = p.read_text()
          pat = r"function applyHardLapse\(progress, cadence, now\) \{.*?\n\}\nfunction applyUncertainLapse"
          repl = '''function applyHardLapse(progress, cadence, now) {
            const wasInRelearn = progress.inRelearn === true;
            const wasLeech = progress.leechDrill === true;
            const establishedDays = preLapseIntervalDays(progress);
            // A lapse is a NEW failure episode of previously established spacing.
            // Fresh-card retries and repeated Hard marks during the same relearn
            // episode stay in the middle deck without repeatedly penalising ease,
            // stage, or the lifetime lapse counter.
            const startsLapseEpisode = !wasInRelearn && !wasLeech && establishedDays > 0;

            progress.streak = 0;
            progress.easyStreak = 0;
            if (startsLapseEpisode) {
              progress.srsStage = Math.max(0, getSrsStage(progress) - 1);
              progress.ease = clamp(getSrsEase(progress) - 0.2, 1.3, 3.0);
              progress.lapseCount = (progress.lapseCount || 0) + 1;
              progress.preLapseIntervalDays = establishedDays;
            }

            // Leech is a property of repeated genuine lapses of an established
            // card. Even a leech still relearns IN SESSION: a failed daily drill
            // goes through middle/due-now until cleared; the 1-day leech cadence
            // is scheduled only after a clean answer in applyCorrectOutcome().
            const shouldLeech = cadence.leechEnabled && (
              wasLeech || (startsLapseEpisode && progress.lapseCount >= LEECH_LAPSE_THRESHOLD)
            );
            if (shouldLeech) {
              progress.leechDrill = true;
              progress.leechStreak = 0;
              progress.inRelearn = false;
              progress.relearnLeft = 0;
              setProgressDelay(progress, 0, now);
              return true;
            }

            // Capture the pre-lapse spacing only when entering the episode. A
            // repeated in-session Hard keeps the original spacing and merely
            // restarts the short relearn ladder.
            if (!wasInRelearn) progress.preLapseIntervalDays = establishedDays;
            progress.inRelearn = true;
            progress.relearnLeft = SRS_HARD_RELEARN_STEPS;
            setProgressDelay(progress, 0, now); // due now — route through middle
            return true;
          }
          function applyUncertainLapse'''
          ns, n = re.subn(pat, repl, s, count=1, flags=re.S)
          if n != 1:
            raise SystemExit(f'applyHardLapse replacement count={n}')
          p.write_text(ns)

          # Release bump required for shipped app changes.
          for path in [Path('index.html'), Path('sw.js'), *Path('pages').glob('*.html')]:
            if path.exists():
              t = path.read_text().replace('?v=177', '?v=178')
              path.write_text(t)
          sw = Path('sw.js')
          t = sw.read_text().replace('mounce-bbg-greek-pwa-v177', 'mounce-bbg-greek-pwa-v178')
          sw.write_text(t)
          PY

          mkdir -p tests
          cat > tests/srs-lapse.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import vm from 'node:vm';
          import { readFileSync } from 'node:fs';

          function loadApplyHardLapse() {
            const source = readFileSync(new URL('../js/app/main.js', import.meta.url), 'utf8');
            const start = source.indexOf('function preLapseIntervalDays(progress)');
            const end = source.indexOf('// Uncertain lapse:', start);
            assert.ok(start >= 0 && end > start, 'expected hard-lapse source block');
            const snippet = source.slice(start, end);
            const context = {
              clamp: (value, min, max) => Math.min(max, Math.max(min, value)),
              getLastEasyIntervalDays: progress => Math.max(0, Number(progress.lastEasyIntervalDays) || 0),
              getSrsStage: progress => Math.max(0, Math.floor(Number(progress.srsStage) || 0)),
              getSrsEase: progress => {
                const ease = Math.min(3, Math.max(1.3, Number(progress.ease) || 2.3));
                progress.ease = ease;
                return ease;
              },
              setProgressDelay: (progress, delayMs, now) => {
                progress.intervalDays = delayMs > 0 ? delayMs / (22 * 60 * 60 * 1000) : 0;
                progress.dueAt = now + delayMs;
              },
              msFromDays: days => days <= 1
                ? days * 22 * 60 * 60 * 1000
                : (22 + (days - 1) * 24) * 60 * 60 * 1000,
              SRS_HARD_RELEARN_STEPS: 2,
              LEECH_LAPSE_THRESHOLD: 4,
              LEECH_DRILL_DAYS: 1
            };
            vm.createContext(context);
            vm.runInContext(`${snippet}\nthis.__applyHardLapse = applyHardLapse;`, context);
            return context.__applyHardLapse;
          }

          const relaxed = { leechEnabled: true, lapseResumeCapDays: 14 };
          const almostEqual = (actual, expected) => assert.ok(Math.abs(actual - expected) < 1e-9, `${actual} ~= ${expected}`);

          test('fresh-card Hard retries never become lapses or leeches', () => {
            const applyHardLapse = loadApplyHardLapse();
            const p = { streak:0,easyStreak:0,srsStage:0,ease:2.3,intervalDays:0,lastEasyIntervalDays:0,inRelearn:false,relearnLeft:0,preLapseIntervalDays:0,lapseCount:0,leechDrill:false,leechStreak:0 };
            for (let n=0;n<6;n++) {
              const now = 1_800_000_000_000+n*1000;
              assert.equal(applyHardLapse(p, relaxed, now), true);
              assert.equal(p.dueAt, now);
            }
            assert.equal(p.lapseCount, 0);
            assert.equal(p.leechDrill, false);
            almostEqual(p.ease, 2.3);
          });

          test('repeated Hard in one established-card relearn episode counts one lapse', () => {
            const applyHardLapse = loadApplyHardLapse();
            const p = { streak:5,easyStreak:5,srsStage:4,ease:2.3,intervalDays:14,lastEasyIntervalDays:14,inRelearn:false,relearnLeft:0,preLapseIntervalDays:0,lapseCount:0,leechDrill:false,leechStreak:0 };
            applyHardLapse(p, relaxed, 1_800_000_000_000);
            assert.equal(p.lapseCount, 1); almostEqual(p.ease,2.1); assert.equal(p.srsStage,3);
            for (let n=1;n<=4;n++) assert.equal(applyHardLapse(p, relaxed, 1_800_000_000_000+n*1000), true);
            assert.equal(p.lapseCount,1); almostEqual(p.ease,2.1); assert.equal(p.srsStage,3); assert.equal(p.leechDrill,false);
          });

          test('fourth genuine lapse marks leech but Hard still retries in-session', () => {
            const applyHardLapse = loadApplyHardLapse();
            const now = 1_800_000_000_000;
            const p = { streak:5,easyStreak:5,srsStage:4,ease:2.3,intervalDays:14,lastEasyIntervalDays:14,inRelearn:false,relearnLeft:0,preLapseIntervalDays:14,lapseCount:3,leechDrill:false,leechStreak:2 };
            assert.equal(applyHardLapse(p, relaxed, now), true);
            assert.equal(p.lapseCount,4); assert.equal(p.leechDrill,true); assert.equal(p.leechStreak,0); assert.equal(p.dueAt,now);
            assert.equal(applyHardLapse(p, relaxed, now+1000), true);
            assert.equal(p.lapseCount,4); assert.equal(p.dueAt,now+1000);
          });
          EOF
      - name: Verify
        run: |
          node --test tests/srs-lapse.test.mjs
          find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          git diff --check
      - name: Commit verified patch
        run: |
          rm .github/workflows/apply-srs-parity.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: align leech lapses with Duff middle-deck semantics [srs-parity-applied]'
          git push origin HEAD:fix/duff-leech-middle-deck-parity
