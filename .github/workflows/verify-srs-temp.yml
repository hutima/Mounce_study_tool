name: Temporary SRS verification
on:
  push:
    branches: [fix/leech-middle-deck-lapses]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/srs-lapse.test.mjs
