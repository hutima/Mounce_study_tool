name: Run temporary SRS patch v2
on:
  push:
    branches: [fix/leech-middle-deck-lapses]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/leech-middle-deck-lapses
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/apply_srs_fix_temp_v2.py
      - run: node --test tests/srs-lapse.test.mjs
      - run: find js -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: git diff --check
      - run: grep -q 'mounce-bbg-greek-pwa-v178' sw.js
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/verify-srs-temp.yml .github/workflows/apply-srs-fix-temp.yml .github/workflows/run-srs-patch-temp.yml .github/workflows/run-srs-patch-temp-v2.yml scripts/apply_srs_fix_temp.py scripts/apply_srs_fix_temp_v2.py
          git add -A
          git commit -m 'Fix leech lapses without breaking middle-deck relearning'
          git push origin HEAD:fix/leech-middle-deck-lapses
